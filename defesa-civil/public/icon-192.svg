<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="38" fill="#0b1220"/>
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2040"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Montanha / terreno -->
  <polygon points="96,28 148,130 44,130" fill="url(#peak)" opacity="0.9"/>
  <polygon points="52,130 96,70 140,130" fill="#0f2040" opacity="0.4"/>
  <!-- Base -->
  <rect x="28" y="130" width="136" height="14" rx="7" fill="#22c55e" opacity="0.85"/>
  <!-- Curvas de nível decorativas -->
  <path d="M 60,110 Q 96,95 132,110" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  <path d="M 70,90 Q 96,77 122,90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Pin de localização -->
  <circle cx="96" cy="60" r="10" fill="#38bdf8" opacity="0.9"/>
  <circle cx="96" cy="60" r="5" fill="#0b1220"/>
  <!-- Texto GV -->
  <text x="96" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#38bdf8" letter-spacing="3">GV</text>
</svg>
