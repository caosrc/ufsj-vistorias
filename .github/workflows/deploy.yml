name: Deploy para Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar npm (evitar crashes)
        run: |
          npm config set fund false
          npm config set audit false
          npm config set progress false

      # FRONTEND
      - name: Instalar dependências frontend
        working-directory: defesa-civil
        run: npm install --no-audit --no-fund --no-progress

      - name: Build frontend
        working-directory: defesa-civil
        run: npm run build
        env:
          VITE_API_URL: ""

      # BACKEND (raiz do projeto)
      - name: Instalar dependências backend
        run: npm install --no-audit --no-fund --no-progress

      # DEPLOY CLOUDFLARE
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
